name: build-macos

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-mac-arm64:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Show tool versions
        run: |
          node -v
          npm -v

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Prepare OCR models
        run: node ./scripts/prepare-paddle-models.mjs

      - name: Rebuild Electron native deps
        run: npx electron-builder install-app-deps

      - name: Build macOS arm64 package
        run: npm run dist:mac

      - name: Verify packaged OCR runtime
        run: node ./scripts/verify-packaged-runtime.mjs mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-ocr-gui-mac-arm64
          path: |
            release/*.dmg
            release/mac-arm64/**
          if-no-files-found: error
