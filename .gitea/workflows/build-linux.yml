name: build-linux

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show tool versions
        run: |
          node -v
          npm -v

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Prepare OCR models
        run: node ./scripts/prepare-paddle-models.mjs

      - name: Rebuild Electron native deps
        run: npx electron-builder install-app-deps

      - name: Build Linux package
        run: npm run dist:linux

      - name: Verify packaged OCR runtime
        run: node ./scripts/verify-packaged-runtime.mjs linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-ocr-gui-linux-x64
          path: |
            release/*.AppImage
            release/linux-unpacked/**
          if-no-files-found: error
